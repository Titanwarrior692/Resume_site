<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact The UCA - United Cities of America</title>
    <link rel="stylesheet" href="Zstyles.css">
</head>
<body>
    <nav class="navbar">
        <a href="Zindex.html">Home</a>
        <a href="Zsecondary.html">History</a>
        <a href="Zlanding.html">Bridges</a>
        <a href="ZDSabout.html">About UCA</a>
        <a href="ZDCcontact.html">Contact</a>
        <a href="ZDSgallery.html">Gallery</a>
        <a href="Zpicture_info.html">Artboard</a>
        <div class="emblem"><img src="ZSeal_of_the_UCA.png" alt="UCA Emblem">
        </div>
    </nav>
    <div class="content">
        <h1>Contact The United Cities of America</h1>
        
        <div class="contact-info">
            <h2>Emergency Contacts</h2>
            <p>Bridges Emergency Services: (555) 123-4567</p>
            <p>UCA Security: (555) 987-6543</p>
            <p>Timefall Shelter Hotline: (555) 456-7890</p>
        </div>

        <div class="contact-form">
            <h2>Contact Form</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="city">Current City:</label>
                    <input type="text" id="city" name="city" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a subject</option>
                        <option value="emergency">Emergency Assistance</option>
                        <option value="shelter">Timefall Shelter Request</option>
                        <option value="bt">B.T. Activity Report</option>
                        <option value="bridges">Bridges Services</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label for="priority">Priority Level:</label>
                    <select id="priority" name="priority" required>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="emergency">Emergency</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
